<style>
@page { size: A4; margin: 2cm 1.8cm 2.2cm 1.8cm;
  @bottom-center { content: counter(page) " / " counter(pages); font-family: "DejaVu Sans", sans-serif; font-size: 8.5pt; color: #666; } }
html { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
body { font-size: 10pt; line-height: 1.38; color: #1a1a1a; margin: 0; }
header#title-block-header { border-bottom: 2px solid #2b4c7e; margin-bottom: 16pt; padding-bottom: 8pt; }
h1.title { font-size: 20pt; margin: 0 0 4pt; color: #2b4c7e; }
p.subtitle { font-size: 12pt; color: #333; margin: 0 0 6pt; }
p.author, p.date { font-size: 9.5pt; color: #444; margin: 1pt 0; }
h2 { font-size: 13.5pt; margin: 18pt 0 6pt; color: #2b4c7e; border-bottom: 1px solid #c9d3e0; padding-bottom: 2pt; page-break-after: avoid; }
h3 { font-size: 11pt; margin: 12pt 0 4pt; page-break-after: avoid; }
p { margin: 0 0 6pt; }
ul, ol { margin: 0 0 6pt; padding-left: 18pt; }
li { margin-bottom: 2pt; }
li > ul { margin-top: 2pt; }
table { border-collapse: collapse; width: 100%; font-size: 8.5pt; margin: 4pt 0 10pt; table-layout: fixed; }
th, td { border: 1px solid #b5b5b5; padding: 3pt 4pt; vertical-align: top; text-align: left; overflow-wrap: break-word; word-break: break-word; }
th { background: #e8edf4; font-weight: bold; }
tr { page-break-inside: avoid; }
tbody tr:nth-child(even) td { background: #f7f8fa; }
figure { margin: 8pt 0 10pt; text-align: center; page-break-inside: avoid; }
figure img { max-width: 100%; max-height: 13.5cm; width: auto; height: auto; border: 1px solid #ccc; }
figcaption { font-size: 8.5pt; color: #555; margin-top: 3pt; }
code { font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 8.5pt; background: #f1f1f1; padding: 0 2pt; border-radius: 2px; overflow-wrap: break-word; }
a { color: #1a4d8f; text-decoration: none; overflow-wrap: break-word; }
strong { color: #111; }
blockquote { margin: 6pt 0; padding: 4pt 10pt; border-left: 3px solid #c9d3e0; color: #333; }
</style>
